{% extends "base.html" %}

{% block title %}Edit Record #{{ record.id }} - Backup Management System{% endblock %}

{% block content %}
<div class="dashboard-header">
    <div>
        <h1>Edit Record #{{ record.id }}</h1>
        <p class="subtitle">Modify record parameters and save updates to SQLite database.</p>
    </div>
    <div>
        <a href="{{ url_for('list_records') }}" class="btn btn-secondary">&larr; Back to Records</a>
    </div>
</div>

<div class="card form-card">
    <form action="{{ url_for('edit_record', record_id=record.id) }}" method="POST" class="grid-form">
        <div class="form-group">
            <label for="name">Record Name *</label>
            <input type="text" id="name" name="name" value="{{ record.name }}" required class="form-control">
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" class="form-control">
                <option value="Server" {% if record.category == 'Server' %}selected{% endif %}>Server Asset</option>
                <option value="Database" {% if record.category == 'Database' %}selected{% endif %}>Database Dump</option>
                <option value="Configuration" {% if record.category == 'Configuration' %}selected{% endif %}>Configuration File</option>
                <option value="Credentials" {% if record.category == 'Credentials' %}selected{% endif %}>Secure Credential</option>
                <option value="General" {% if record.category == 'General' %}selected{% endif %}>General Data</option>
            </select>
        </div>
        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status" class="form-control">
                <option value="Active" {% if record.status == 'Active' %}selected{% endif %}>Active</option>
                <option value="Pending" {% if record.status == 'Pending' %}selected{% endif %}>Pending</option>
                <option value="Archived" {% if record.status == 'Archived' %}selected{% endif %}>Archived</option>
            </select>
        </div>
        <div class="form-group">
            <label for="value">Estimated Value ($)</label>
            <input type="number" step="0.01" id="value" name="value" value="{{ record.value }}" class="form-control">
        </div>
        <div class="form-group full-width">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" class="form-control">{{ record.description or '' }}</textarea>
        </div>
        <div class="form-actions full-width">
            <button type="submit" class="btn btn-success">Update Record</button>
            <a href="{{ url_for('list_records') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
